[package]
name = "miqat"
version = "0.1.0"
description = "Prayer times in your menu bar"
edition = "2021"

[lib]
name = "miqat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
salah = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAttributedString", "NSDictionary", "NSString"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAttributedString",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
